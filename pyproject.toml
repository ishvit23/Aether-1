[project]
name = "aether-1"
version = "0.1.0"
description = "Configurable multi-agent simulation engine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pygame>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["aether"]
omit = [
    "aether/viz/*",
    "aether/simulation/*",
    "aether/utils/logger.py",
    "aether/world/world_loader.py",
    "aether/resources/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0.12.20250915",
]
